<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1020" />
  <title>おへやモンスター</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1020;
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; color: #dfe7ff; }
    #app { position: fixed; inset: 0; z-index: 1; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; background: #0b1020; }
    .veil { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; gap: 18px; background: #0b1020; z-index: 20; padding: 24px; }
    .veil h1 { font-size: 40px; margin: 0; letter-spacing: 2px; }
    .veil .title-en { font-size: 13px; opacity: .55; letter-spacing: 4px; text-transform: uppercase; }
    .veil .ver { font-size: 12px; opacity: .5; margin-top: -8px; }
    .veil .desc { font-size: 14px; opacity: .8; line-height: 1.7; max-width: 420px; }
    .big-btn { font-size: 20px; font-weight: 700; color: #0b1020; background: linear-gradient(135deg,#7cf0ff,#4f8bff);
      border: none; border-radius: 999px; padding: 16px 44px; box-shadow: 0 6px 24px rgba(79,139,255,.45); }
    .big-btn.secondary { background: linear-gradient(135deg,#5a6b8c,#39435e); }
    .ar-err { font-size: 13px; color: #ffb3b3; background: rgba(214,58,30,.18); border: 1px solid rgba(255,120,100,.4);
      border-radius: 12px; padding: 10px 16px; max-width: 420px; line-height: 1.6; white-space: pre-line; }
    .note { font-size: 12px; opacity: .6; }
    .hud { position: fixed; inset: 0; padding: calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px);
      display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; z-index: 10; }
    .hud .top, .hud .bottom { display: flex; justify-content: space-between; align-items: center; }
    .hud .chip { pointer-events: auto; background: linear-gradient(135deg,#241a54,#4a2f8f); border: 1px solid rgba(255,215,120,.65);
      border-radius: 16px; padding: 10px 18px; font-size: 22px; font-weight: 800; color: #ffe9a8; letter-spacing: .5px;
      box-shadow: 0 0 20px rgba(255,190,60,.45), inset 0 0 12px rgba(255,230,150,.18); }
    .hud .icon-btn { pointer-events: auto; width: 52px; height: 52px; border-radius: 50%; color: #fff; font-size: 26px;
      display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,.55);
      box-shadow: 0 3px 12px rgba(0,0,0,.45), 0 0 18px rgba(120,240,255,.4); }
    #sound-btn { background: radial-gradient(circle at 35% 30%, #35c8d6, #1e6bd1); }
    #exit-btn { background: radial-gradient(circle at 35% 30%, #ff8a7a, #c0284a); font-size: 30px; }
    .status-tip { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); display: none; pointer-events: none;
      text-align: center; font-size: 26px; font-weight: 900; letter-spacing: 1px; line-height: 1.4;
      color: #fff; text-shadow: 0 0 14px rgba(120,240,255,.85), 0 1px 3px #000;
      padding: 12px 28px; border-radius: 18px; max-width: 86%;
      background: linear-gradient(135deg, rgba(24,22,58,.6), rgba(70,36,100,.6));
      border: 2px solid rgba(120,240,255,.55);
      box-shadow: 0 0 28px rgba(120,240,255,.45), inset 0 0 18px rgba(150,120,255,.18);
      backdrop-filter: blur(4px); z-index: 12; }
    .status-tip.show { display: block; animation: bannerPop .35s ease; }
    .status-tip.bad { color: #ffc0b8; border-color: rgba(255,90,80,.78); background: linear-gradient(135deg,rgba(70,12,22,.65),rgba(130,30,22,.65)); box-shadow: 0 0 26px rgba(255,80,70,.55); text-shadow: 0 0 12px rgba(255,120,90,.85),0 1px 2px #000; }
    @keyframes bannerPop { 0% { transform: translateX(-50%) scale(.5); opacity: 0 } 100% { transform: translateX(-50%) scale(1); opacity: 1 } }
    @media (max-width: 600px) { .status-tip { font-size: 20px; } .hud .chip { font-size: 18px; padding: 8px 14px; } }
    .set-row { font-size: 18px; margin: 18px 0 6px; }
    input#horizon { width: min(70vw, 320px); accent-color: #7cf0ff; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <div id="app"></div>

  <!-- タイトル/スタート オーバーレイ -->
  <div id="title" class="veil">
    <div class="title-en">Oheya Monster</div>
    <h1>おへやモンスター</h1>
    <div class="ver" id="ver"></div>
    <div class="desc">
    </div>
    <button id="start-ar" class="big-btn">スタート</button>
    <button id="settings-btn" class="big-btn secondary">設定</button>
    <div id="ar-error" class="ar-err hidden"></div>
  </div>

  <!-- 設定画面 -->
  <div id="settings" class="veil hidden">
    <h1>設定</h1>
    <div class="ver">実空間とのズレを調整</div>
    <div class="set-row">地平線（奥の上下） <b id="horizon-val">25°</b></div>
    <input type="range" id="horizon" min="0" max="50" step="1" value="25" aria-label="地平線の角度">
    <div class="set-row">左右（ヨー）の向き <b id="yaw-val">0°</b></div>
    <input type="range" id="yaw" min="-30" max="30" step="1" value="0" aria-label="左右の向き">
    <div class="set-row">同時出現数の上限 <b id="max-val">5</b></div>
    <input type="range" id="maxmons" min="1" max="10" step="1" value="5" aria-label="同時出現の上限">
    <div class="set-row">出現の奥行き（遠さ） <b id="depth-val">3</b></div>
    <input type="range" id="depth" min="1" max="6" step="1" value="3" aria-label="出現の奥行き">
    <div class="set-row">飛ぶ高さ <b id="flyh-val">3</b></div>
    <input type="range" id="flyh" min="1" max="6" step="1" value="3" aria-label="飛ぶ高さ">
    <button id="settings-done" class="big-btn">閉じる</button>
  </div>

  <!-- AR/遊戯中 HUD -->
  <div id="hud" class="hud hidden">
    <div class="top">
      <div style="display:flex;gap:8px;align-items:center">
        <div class="chip" id="catch-counter">つかまえた: 0</div>
        <div class="chip" id="gyro-stat" style="font-size:14px;padding:6px 10px;box-shadow:none">ジャイロ…</div>
      </div>
      <button id="sound-btn" class="icon-btn">♪</button>
    </div>
    <div class="status-tip" id="status-tip">まわりを映して ゆかにモンスターをさがそう</div>
    <div class="bottom">
      <button id="dex-btn" class="icon-btn">図</button>
      <button id="exit-btn" class="icon-btn">✕</button>
    </div>
  </div>

  <!-- 図鑑オーバーレイ -->
  <div id="dex" class="veil hidden">
    <h1 style="font-size:28px">ずかん</h1>
    <div id="dex-list" style="max-height:50vh;overflow-y:auto;width:100%;max-width:420px"></div>
    <button id="dex-close" class="big-btn" style="font-size:16px">とじる</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
